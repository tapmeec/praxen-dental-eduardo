<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praxen Dental - Enlaces</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        praxen: {
                            dark: '#0B132B',
                            card: '#1C2541',
                            accent: '#00B4D8',
                            cyan: '#48CAE4',
                            text: '#E0FBFC'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0B132B;
            color: #E0FBFC;
        }
        .glow-effect:hover {
            box-shadow: 0 0 20px rgba(0, 180, 216, 0.35);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-praxen-dark text-praxen-text relative overflow-x-hidden">

    <!-- Top Navigation / Main Menu Return -->
    <header class="w-full max-w-md mx-auto px-6 pt-6 flex justify-between items-center z-10">
        <a href="#" onclick="alert('Volviendo al menú principal...'); return false;" class="inline-flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-praxen-cyan hover:text-white transition bg-praxen-card/80 border border-praxen-accent/30 px-3.5 py-2 rounded-full shadow-md backdrop-blur-md">
            <i class="fa-solid fa-arrow-left text-sm"></i> Menú Principal
        </a>
        <span class="text-xs uppercase tracking-widest text-praxen-cyan/70 font-bold">Praxen Dental</span>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-md mx-auto px-6 py-8 flex flex-col items-center flex-grow z-10">
        
        <!-- Profile & Business Photo -->
        <div class="relative mb-6">
            <div class="absolute -inset-1 rounded-full bg-gradient-to-r from-praxen-accent to-praxen-cyan opacity-75 blur-sm"></div>
            <div class="relative w-28 h-28 rounded-full overflow-hidden border-2 border-praxen-accent bg-praxen-card flex items-center justify-center shadow-xl">
                <!-- Using a clean professional dental placeholder / avatar -->
                <img src="https://images.unsplash.com/photo-1629909613654-28e377c37b09?w=300&auto=format&fit=crop&q=80" alt="Praxen Dental" class="w-full h-full object-cover">
            </div>
        </div>

        <!-- Business Name & Subtitle -->
        <h1 class="text-2xl font-bold tracking-tight text-white mb-1 text-center">PRAXEN DENTAL</h1>
        <p class="text-xs font-medium uppercase tracking-widest text-praxen-cyan mb-8 text-center">Laboratorio & Odontología Avanzada</p>

        <!-- Links List -->
        <div class="w-full flex flex-col gap-4">
            
            <!-- 1. Exchange Contact -->
            <button onclick="downloadVCard()" class="w-full group flex items-center justify-between p-4 rounded-xl bg-praxen-card border border-praxen-accent/30 hover:border-praxen-cyan transition-all duration-300 glow-effect shadow-lg">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-lg bg-praxen-accent/10 flex items-center justify-center text-praxen-cyan group-hover:bg-praxen-accent group-hover:text-praxen-dark transition-colors">
                        <i class="fa-solid fa-address-book text-lg"></i>
                    </div>
                    <div class="text-left">
                        <span class="block text-sm font-bold text-white">Guardar Contacto</span>
                        <span class="block text-xs text-praxen-cyan/80">Exchange Contact (vCard)</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-praxen-cyan/60 group-hover:translate-x-1 transition-transform"></i>
            </button>

            <!-- 2. WhatsApp -->
            <a href="https://wa.me/573106098774" target="_blank" rel="noopener noreferrer" class="w-full group flex items-center justify-between p-4 rounded-xl bg-praxen-card border border-praxen-accent/30 hover:border-praxen-cyan transition-all duration-300 glow-effect shadow-lg">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-lg bg-praxen-accent/10 flex items-center justify-center text-praxen-cyan group-hover:bg-praxen-accent group-hover:text-praxen-dark transition-colors">
                        <i class="fa-brands fa-whatsapp text-xl"></i>
                    </div>
                    <div class="text-left">
                        <span class="block text-sm font-bold text-white">WhatsApp</span>
                        <span class="block text-xs text-praxen-cyan/80">Atención directa y pedidos</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-praxen-cyan/60 group-hover:translate-x-1 transition-transform"></i>
            </a>

            <!-- 3. Instagram -->
            <a href="https://www.instagram.com/praxen_dentallab?utm_source=ig_web_button_share_sheet&psln=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener noreferrer" class="w-full group flex items-center justify-between p-4 rounded-xl bg-praxen-card border border-praxen-accent/30 hover:border-praxen-cyan transition-all duration-300 glow-effect shadow-lg">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-lg bg-praxen-accent/10 flex items-center justify-center text-praxen-cyan group-hover:bg-praxen-accent group-hover:text-praxen-dark transition-colors">
                        <i class="fa-brands fa-instagram text-xl"></i>
                    </div>
                    <div class="text-left">
                        <span class="block text-sm font-bold text-white">Instagram</span>
                        <span class="block text-xs text-praxen-cyan/80">@praxen_dentallab</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-praxen-cyan/60 group-hover:translate-x-1 transition-transform"></i>
            </a>

            <!-- 4. Google Reviews -->
            <a href="https://search.google.com/local/writereview?placeid=ChIJf2isBPWaP44R3h30sqt6EBA" target="_blank" rel="noopener noreferrer" class="w-full group flex items-center justify-between p-4 rounded-xl bg-praxen-card border border-praxen-accent/30 hover:border-praxen-cyan transition-all duration-300 glow-effect shadow-lg">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-lg bg-praxen-accent/10 flex items-center justify-center text-praxen-cyan group-hover:bg-praxen-accent group-hover:text-praxen-dark transition-colors">
                        <i class="fa-solid fa-star text-lg"></i>
                    </div>
                    <div class="text-left">
                        <span class="block text-sm font-bold text-white">Reseñas de Google</span>
                        <span class="block text-xs text-praxen-cyan/80">Déjanos tu opinión</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-praxen-cyan/60 group-hover:translate-x-1 transition-transform"></i>
            </a>

        </div>

    </main>

    <!-- Footer with Tap Me Logo -->
    <footer class="w-full max-w-md mx-auto py-6 flex flex-col items-center justify-center z-10 border-t border-praxen-card mt-auto">
        <div class="text-[10px] uppercase tracking-widest text-praxen-cyan/60 mb-2 font-semibold">Powered by</div>
        <!-- Tap Me Logo Footer Badge -->
        <div class="flex items-center gap-2 bg-praxen-card px-4 py-1.5 rounded-full border border-praxen-accent/20 shadow-inner">
            <div class="w-5 h-5 rounded-full bg-gradient-to-tr from-praxen-accent to-praxen-cyan flex items-center justify-center text-[10px] text-praxen-dark font-black">
                <i class="fa-solid fa-nfc-signal"></i>
            </div>
            <span class="text-xs font-bold tracking-wider text-white">TAP ME</span>
        </div>
    </footer>

    <!-- Script to generate vCard (.vcf) dynamically -->
    <script>
        function downloadVCard() {
            const vCardData = 
`BEGIN:VCARD
VERSION:3.0
FN:Eduardo Cruz
ORG:PRAXEN DENTAL
TEL;TYPE=WORK,VOICE:+573106098774
END:VCARD`;

            const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Praxen_Dental_Eduardo_Cruz.vcf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
