<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eduardo Cruz - Director | Praxen Dental</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        praxen: {
                            lightBg: '#FFFFFF',
                            cardBg: '#F8FAFC',
                            cardBorder: '#E2E8F0',
                            accent: '#00B4D8',
                            darkText: '#0B132B',
                            subText: '#64748B'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FFFFFF;
            color: #0B132B;
        }
        .glow-effect:hover {
            box-shadow: 0 10px 25px -5px rgba(0, 180, 216, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-white text-praxen-dark relative overflow-x-hidden">

    <!-- Top Header / Logo Praxen -->
    <header class="w-full max-w-md mx-auto px-4 pt-6 relative z-25 h-16">
        <div class="absolute left-6 top-4">
            <img src="logopraxendental.png" alt="Praxen Dental Logo" class="w-28 object-contain drop-shadow-sm">
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-md mx-auto px-6 py-2 flex flex-col items-center flex-grow z-10">
        
        <!-- Profile & Business Photo -->
        <div class="relative mb-4 mt-2">
            <div class="absolute -inset-1 rounded-full bg-gradient-to-r from-praxen-accent to-cyan-400 opacity-50 blur-sm"></div>
            <div class="relative w-32 h-32 rounded-full overflow-hidden border-2 border-praxen-accent bg-praxen-cardBg flex items-center justify-center shadow-lg">
                <img src="https://images.unsplash.com/photo-1629909613654-28e377c37b09?w=300&auto=format&fit=crop&q=80" alt="Eduardo Cruz" class="w-full h-full object-cover">
            </div>
        </div>

        <!-- Name & Title -->
        <h1 class="text-2xl font-bold tracking-tight text-praxen-dark mb-1 text-center">Eduardo Cruz</h1>
        <p class="text-xs font-semibold uppercase tracking-widest text-praxen-accent mb-6 text-center">Director</p>

        <!-- Links List -->
        <div class="w-full flex flex-col gap-3.5">
            
            <!-- 1. Exchange Contact (Cyan/Accent) -->
            <a id="vcard-download-btn" download="Eduardo_Cruz_Praxen_Dental.vcf" class="w-full group flex items-center justify-between p-3.5 rounded-xl bg-praxen-cardBg border border-slate-200 hover:border-praxen-accent transition-all duration-300 glow-effect shadow-md cursor-pointer">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-lg bg-sky-500/10 flex items-center justify-center text-sky-600 group-hover:bg-sky-500 group-hover:text-white transition-colors">
                        <i class="fa-solid fa-address-book text-lg"></i>
                    </div>
                    <div class="text-left">
                        <span class="block text-sm font-bold text-slate-800">Exchange Contact</span>
                        <span class="block text-xs text-slate-500">Guardar contacto</span>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-down text-xs text-slate-400 group-hover:translate-y-0.5 transition-transform"></i>
            </a>

            <!-- 2. WhatsApp (Green Theme) -->
            <a href="https://wa.me/573106098774" target="_blank" rel="noopener noreferrer" class="w-full group flex items-center justify-between p-3.5 rounded-xl bg-praxen-cardBg border border-slate-200 hover:border-emerald-500 transition-all duration-300 shadow-md">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-lg bg-emerald-500/10 flex items-center justify-center text-emerald-600 group-hover:bg-emerald-500 group-hover:text-white transition-colors">
                        <i class="fa-brands fa-whatsapp text-xl"></i>
                    </div>
                    <div class="text-left">
                        <span class="block text-sm font-bold text-slate-800">WhatsApp</span>
                        <span class="block text-xs text-emerald-600 font-medium">+57 310 6098774</span>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-right text-xs text-slate-400 group-hover:translate-x-1 transition-transform"></i>
            </a>

            <!-- 3. Instagram (Pink/Purple Theme) -->
            <a href="https://www.instagram.com/praxen_dentallab?utm_source=ig_web_button_share_sheet&psln=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener noreferrer" class="w-full group flex items-center justify-between p-3.5 rounded-xl bg-praxen-cardBg border border-slate-200 hover:border-pink-500 transition-all duration-300 shadow-md">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-lg bg-pink-500/10 flex items-center justify-center text-pink-600 group-hover:bg-pink-500 group-hover:text-white transition-colors">
                        <i class="fa-brands fa-instagram text-xl"></i>
                    </div>
                    <div class="text-left">
                        <span class="block text-sm font-bold text-slate-800">Instagram</span>
                        <span class="block text-xs text-slate-500">Portafolio y casos clínicos</span>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-400 group-hover:scale-110 transition-transform"></i>
            </a>

            <!-- 4. Google Reviews (Yellow/Amber Theme) -->
            <a href="https://search.google.com/local/writereview?placeid=ChIJf2isBPWaP44R3h30sqt6EBA" target="_blank" rel="noopener noreferrer" class="w-full group flex items-center justify-between p-3.5 rounded-xl bg-praxen-cardBg border border-slate-200 hover:border-amber-500 transition-all duration-300 shadow-md">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-lg bg-amber-500/10 flex items-center justify-center text-amber-500 group-hover:bg-amber-500 group-hover:text-white transition-colors">
                        <i class="fa-solid fa-star text-lg"></i>
                    </div>
                    <div class="text-left">
                        <span class="block text-sm font-bold text-slate-800">Reseñas de Google</span>
                        <span class="block text-xs text-slate-500">Califica nuestra atención</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-slate-400 group-hover:translate-x-1 transition-transform"></i>
            </a>

        </div>

    </main>

    <!-- Footer with "Powered by" and Tap Me Logo Image (Sin línea, fondo totalmente blanco) -->
    <footer class="w-full max-w-md mx-auto pt-5 pb-8 flex flex-col items-center justify-center z-10 mt-auto bg-white">
        <div class="text-[10px] uppercase tracking-widest text-slate-400 mb-1 font-semibold">Powered by</div>
        <img src="logotapme.png" alt="Tap Me Logo" class="w-32 object-contain">
    </footer>

    <!-- Script to set Data URI directly on the anchor element -->
    <script>
        const vCardData = 
`BEGIN:VCARD
VERSION:3.0
N:Cruz;Eduardo;;;
FN:Eduardo Cruz
ORG:PRAXEN DENTAL
TITLE:Director
TEL;TYPE=WORK,VOICE:+573106098774
END:VCARD`;

        const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        document.getElementById('vcard-download-btn').setAttribute('href', url);
    </script>
</body>
</html>
